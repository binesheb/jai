name: JAI Incident Review

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.issue.state == 'open' && startsWith(github.event.issue.title, 'JAI Bootstrap Incident -')
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite incident log into a resolution checklist
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import os
          import re
          import subprocess

          issue = os.environ["ISSUE_NUMBER"]
          repo = os.environ["GH_REPO"]

          body = subprocess.check_output(
              ["gh", "issue", "view", issue, "--repo", repo, "--json", "body", "--jq", ".body"],
              text=True
          )
          lower = body.lower()

          checks = []
          def add(key, label):
              if key in lower and label not in [x[1] for x in checks]:
                  checks.append((key, label))

          add("git ", "GitHub repository access / Git transport")
          add("git clone", "Repository clone/update")
          add("git fetch", "Repository fetch/recovery")
          add("github authentication", "GitHub authentication and write access")
          add("wsl", "WSL installation and health")
          add("docker", "Docker Desktop / Docker Engine")
          add("docker compose", "Docker Compose configuration")
          add("docker compose pull", "Infrastructure image pull")
          add("docker compose up", "JAI service startup")
          add("health check", "JAI health check")
          add("postgres", "PostgreSQL / pgvector")
          add("redis", "Redis")
          add("permission", "Windows permissions / elevation")
          add("reboot", "Pending Windows restart")

          if not checks:
              checks.append(("failure", "Review and resolve the reported bootstrap failure"))

          start = "<!-- JAI_INCIDENT_CHECKLIST_START -->"
          end = "<!-- JAI_INCIDENT_CHECKLIST_END -->"
          lines = [
              start,
              "## JAI Resolution Checklist",
              "",
              "Generated automatically from the incident log. Self-Heal should clear these items as repairs succeed.",
              ""
          ]
          for _, label in checks:
              lines.append(f"- [ ] {label}")
          lines += [
              "",
              "The incident remains open until JAI reports a successful final health check.",
              "",
              end
          ]
          section = "\n".join(lines)

          if start in body and end in body:
              body = re.sub(re.escape(start) + r".*?" + re.escape(end), section, body, flags=re.S)
          else:
              body = body.rstrip() + "\n\n" + section + "\n"

          subprocess.run(
              ["gh", "issue", "edit", issue, "--repo", repo, "--body", body],
              check=True
          )
          subprocess.run(
              ["gh", "issue", "comment", issue, "--repo", repo, "--body",
               """## AI review queue

This incident is ready for ChatGPT/GitHub review. Read all logs under logs/incidents/ for this host, inspect the relevant repository code and recent CI history, then:

1. Determine the root cause from evidence.
2. If it is documentation/configuration/operational guidance, update the Issue with the exact remediation.
3. If a repository code/config change is required, create a focused PR; do not make unrelated changes.
4. Run/verify CI and record the result on this Issue.
5. If the failure is caused by the Windows environment rather than JAI code, document the environmental remediation instead of changing code.

Do not invent successful tests or claim the local machine was repaired unless the evidence shows it."""],
              check=True
          )
          print(f"Updated issue #{issue} with a machine-generated resolution checklist and AI review request.")
