services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JAI_POSTGRES_DB:-jai}
      POSTGRES_USER: ${JAI_POSTGRES_USER:-jai}
      POSTGRES_PASSWORD: ${JAI_POSTGRES_PASSWORD:?Set JAI_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JAI_POSTGRES_USER:-jai} -d ${JAI_POSTGRES_DB:-jai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
