services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JAI_POSTGRES_DB:-jai}
      POSTGRES_USER: ${JAI_POSTGRES_USER:-jai}
      POSTGRES_PASSWORD: ${JAI_POSTGRES_PASSWORD:?Set JAI_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${JAI_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JAI_POSTGRES_USER:-jai} -d ${JAI_POSTGRES_DB:-jai}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${JAI_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
